name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Report the required `test` and `release-policy` contexts on the merge
  # queue's speculative merge commits, so a queued PR is verified against the
  # main it will actually land on rather than the one it was opened against.
  merge_group:

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
#
# release-tag.yml mints only from a completed `CI` run whose event is `push`,
# and it reads the `test` and `release-policy` check-runs on the exact
# version-introducing commit, so a run dropped here leaves that version
# untaggable until the run is replayed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      # The packager is what a release actually runs, and nothing on a pull
      # request used to run it. A dependabot bump moved @types/vscode past
      # engines.vscode and every check stayed green, so the mismatch was only
      # ever going to surface at tag time, on a tag that resolves its workflows
      # from itself and cannot be repaired by a later fix on main.
      #
      # This is a step inside the existing required 'test' context rather than a
      # new job, so it reports on the pull_request event with no ruleset change.
      # TAG_NAME is derived from package.json at run time so the check grades the
      # version that will actually be tagged rather than one typed in here.
      - name: Package VSIX (the script release.yml runs)
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          TAG_NAME="v${version}" node ./scripts/package-vsix.mjs
          # Assert the artifact, not just the exit code: a packager that stops
          # writing a file would otherwise pass this step silently.
          test -f "kin-${version}.vsix"
          echo "packaged kin-${version}.vsix"
      - name: Audit (high/critical)
        run: npm audit --audit-level=high

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - name: Verify release policy metadata
        run: node ./scripts/release-policy.mjs verify
      - name: Gate release-impacting version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          node ./scripts/release-policy.mjs check-bump \
            --base FETCH_HEAD \
            --head HEAD \
            --head-ref "$HEAD_REF" \
            --head-repo "$HEAD_REPO" \
            --base-repo "$BASE_REPO"
