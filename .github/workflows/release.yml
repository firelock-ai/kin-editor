name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: kin-editor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: marketplace-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - name: Package VSIX
        run: node ./scripts/package-vsix.mjs
        env:
          TAG_NAME: ${{ github.ref_name }}
      # Marketplace and Open VSX are two independent targets, so a stuck Marketplace
      # publish must not stop Open VSX from ever being attempted (all four v0.1.11
      # attempts died on Marketplace before Open VSX ever ran). Both publish steps
      # below carry continue-on-error and run back to back; "Require both publish
      # targets succeeded" at the end is what actually fails the job.
      - name: Publish VSIX to Visual Studio Marketplace
        id: marketplace_publish
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          set -euo pipefail
          : "${VSCE_TOKEN:?VSCE_TOKEN is required for a release}"

          node --input-type=module <<'NODE'
          import { publishVSIX } from "@vscode/vsce";

          const version = process.env.RELEASE_VERSION.replace(/^v/, "");
          const packagePath = `kin-${version}.vsix`;
          // vsce's own retry-with-backoff (cockatiel) only wraps the signed-package
          // path, which this workflow never takes, so a plain publishVSIX() call has
          // no retry at all against a gallery timeout. Bound it here instead: three
          // attempts, short backoff, each attempt's outcome logged.
          const maxAttempts = 3;
          const backoffMs = [15000, 30000];

          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            try {
              await publishVSIX(packagePath, {
                pat: process.env.VSCE_TOKEN,
                preRelease: version.includes("-"),
                skipDuplicate: true,
              });
              console.log(`Published ${packagePath} to Visual Studio Marketplace (attempt ${attempt}/${maxAttempts})`);
              break;
            } catch (err) {
              console.log(`Marketplace publish attempt ${attempt}/${maxAttempts} failed: ${err.message}`);
              if (attempt === maxAttempts) {
                console.log(`::error::Marketplace publish of ${packagePath} exhausted ${maxAttempts} attempts`);
                throw err;
              }
              const waitMs = backoffMs[attempt - 1];
              console.log(`Retrying in ${waitMs / 1000}s...`);
              await new Promise((resolve) => setTimeout(resolve, waitMs));
            }
          }
          NODE

      - name: Publish VSIX to Open VSX
        id: openvsx_publish
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          set -euo pipefail
          : "${OVSX_TOKEN:?OVSX_TOKEN is required for a release}"
          version="${RELEASE_VERSION#v}"
          package="kin-${version}.vsix"
          # ovsx carries no retry or timeout handling of its own, so bound each
          # attempt explicitly and retry the same three-attempt, logged shape used
          # for the Marketplace publish above.
          max_attempts=3
          backoffs=(15 30)
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Open VSX publish attempt ${attempt}/${max_attempts}..."
            set +e
            timeout 180 npx --yes ovsx publish "$package" -p "$OVSX_TOKEN" --skip-duplicate
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "Published ${package} to Open VSX (attempt ${attempt}/${max_attempts})"
              exit 0
            fi
            echo "Open VSX publish attempt ${attempt}/${max_attempts} failed (exit ${rc})"
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Open VSX publish of ${package} exhausted ${max_attempts} attempts"
              exit 1
            fi
            wait_s="${backoffs[$((attempt - 1))]}"
            echo "Retrying in ${wait_s}s..."
            sleep "$wait_s"
            attempt=$((attempt + 1))
          done

      - name: Verify exact Visual Studio Marketplace version
        id: marketplace_verify
        continue-on-error: true
        if: steps.marketplace_publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          for attempt in $(seq 1 20); do
            if ./node_modules/.bin/vsce show firelock.kin-editor --json \
              | jq -e --arg version "$version" \
                '.versions | any(.version == $version)' >/dev/null; then
              echo "Visual Studio Marketplace exposes firelock.kin-editor ${version}"
              exit 0
            fi
            echo "Marketplace version ${version} not visible yet (attempt ${attempt}/20)"
            sleep 15
          done
          echo "::error::Visual Studio Marketplace does not expose firelock.kin-editor ${version}"
          exit 1

      - name: Verify exact Open VSX version
        id: openvsx_verify
        continue-on-error: true
        if: steps.openvsx_publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          for attempt in $(seq 1 20); do
            published="$(curl --fail --silent --show-error \
              "https://open-vsx.org/api/firelock/kin-editor/${version}" \
              | jq -r '.version // empty' || true)"
            if [ "$published" = "$version" ]; then
              echo "Open VSX exposes firelock.kin-editor ${version}"
              exit 0
            fi
            echo "Open VSX version ${version} not visible yet (attempt ${attempt}/20)"
            sleep 15
          done
          echo "::error::Open VSX does not expose firelock.kin-editor ${version}"
          exit 1

      - name: Publish verified GitHub release
        if: >-
          steps.marketplace_publish.outcome == 'success' &&
          steps.marketplace_verify.outcome == 'success' &&
          steps.openvsx_publish.outcome == 'success' &&
          steps.openvsx_verify.outcome == 'success'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: kin-*.vsix

      # continue-on-error above keeps each publish/verify from blocking the other
      # target, which also means none of those failures fail the JOB on their own.
      # This is the step that actually does: read every outcome and fail loud if
      # either target did not fully publish and verify, so release-recovery.yml's
      # existing rerun-then-escalate flow still triggers exactly as before.
      - name: Require both publish targets succeeded
        if: always()
        run: |
          set -euo pipefail
          mp_publish="${{ steps.marketplace_publish.outcome }}"
          mp_verify="${{ steps.marketplace_verify.outcome }}"
          ovsx_publish="${{ steps.openvsx_publish.outcome }}"
          ovsx_verify="${{ steps.openvsx_verify.outcome }}"
          echo "Marketplace: publish=${mp_publish} verify=${mp_verify}"
          echo "Open VSX:    publish=${ovsx_publish} verify=${ovsx_verify}"

          marketplace_ok=0
          if [ "$mp_publish" = "success" ] && [ "$mp_verify" = "success" ]; then
            marketplace_ok=1
          fi
          openvsx_ok=0
          if [ "$ovsx_publish" = "success" ] && [ "$ovsx_verify" = "success" ]; then
            openvsx_ok=1
          fi

          if [ "$marketplace_ok" -ne 1 ] || [ "$openvsx_ok" -ne 1 ]; then
            echo "::error::at least one publish target did not fully succeed (marketplace publish=${mp_publish}/verify=${mp_verify}, openvsx publish=${ovsx_publish}/verify=${ovsx_verify})"
            exit 1
          fi
          echo "Both Visual Studio Marketplace and Open VSX published and verified."
