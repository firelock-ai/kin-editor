name: Release Recovery

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: kin-editor-release-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry transient release failure
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.status == 'completed' &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'startup_failure'
      ) &&
      github.event.workflow_run.run_attempt < 3 &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable failed run and rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          run="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}")"
          [ "$(jq -r .path <<< "$run")" = ".github/workflows/release.yml" ]
          [ "$(jq -r .event <<< "$run")" = push ]
          [ "$(jq -r .head_branch <<< "$run")" = "$TAG" ]
          [ "$(jq -r .head_sha <<< "$run")" = "$SHA" ]
          ref="$(gh api "repos/${REPO}/git/ref/tags/${TAG}")"
          object_sha="$(jq -er .object.sha <<< "$ref")"
          object_type="$(jq -er .object.type <<< "$ref")"
          if [ "$object_type" = tag ]; then
            object_sha="$(
              gh api "repos/${REPO}/git/tags/${object_sha}" --jq .object.sha
            )"
          fi
          [ "$object_sha" = "$SHA" ]
          gh api \
            --method POST \
            "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"
