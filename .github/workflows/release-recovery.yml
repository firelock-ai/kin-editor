name: Release Recovery

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions: {}

concurrency:
  # Serialize every event for one immutable release tag. This prevents a
  # repeated terminal event from racing itself into duplicate issues.
  group: kin-editor-release-recovery-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry transient release failure
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.status == 'completed' &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'startup_failure'
      ) &&
      github.event.workflow_run.run_attempt < 3 &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out exact recovery-policy authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate immutable failed run and rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA" ]
          run_file="$RUNNER_TEMP/release-run.json"
          context_file="$RUNNER_TEMP/retry-context.json"
          gh api "repos/${REPO}/actions/runs/${RUN_ID}" > "$run_file"
          node scripts/release-recovery-policy.mjs validate \
            --repository "$REPO" --expect retry \
            < "$run_file" > "$context_file"
          [ "$(jq -r .runId "$context_file")" = "$RUN_ID" ]
          [ "$(jq -r .tag "$context_file")" = "$TAG" ]
          [ "$(jq -r .headSha "$context_file")" = "$SHA" ]
          ref="$(gh api "repos/${REPO}/git/ref/tags/${TAG}")"
          object_sha="$(jq -er .object.sha <<< "$ref")"
          object_type="$(jq -er .object.type <<< "$ref")"
          for _ in 1 2 3 4; do
            [ "$object_type" = tag ] || break
            tag_object="$(gh api "repos/${REPO}/git/tags/${object_sha}")"
            object_type="$(jq -er .object.type <<< "$tag_object")"
            object_sha="$(
              jq -er .object.sha <<< "$tag_object"
            )"
          done
          [ "$object_type" = commit ]
          [ "$object_sha" = "$SHA" ]
          gh api \
            --method POST \
            "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"

  escalate:
    name: Escalate exhausted automatic release failure
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.status == 'completed' &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'startup_failure'
      ) &&
      github.event.workflow_run.run_attempt >= 3 &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out exact recovery-policy authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate exact terminal failed run and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA" ]
          run_file="$RUNNER_TEMP/release-run.json"
          context_file="$RUNNER_TEMP/escalation-context.json"
          issue_file="$RUNNER_TEMP/release-issue.json"
          gh api "repos/${REPO}/actions/runs/${RUN_ID}" > "$run_file"
          node scripts/release-recovery-policy.mjs validate \
            --repository "$REPO" --expect escalate \
            < "$run_file" > "$context_file"
          [ "$(jq -r .runId "$context_file")" = "$RUN_ID" ]
          [ "$(jq -r .tag "$context_file")" = "$TAG" ]
          [ "$(jq -r .headSha "$context_file")" = "$SHA" ]
          ref="$(gh api "repos/${REPO}/git/ref/tags/${TAG}")"
          object_sha="$(jq -er .object.sha <<< "$ref")"
          object_type="$(jq -er .object.type <<< "$ref")"
          for _ in 1 2 3 4; do
            [ "$object_type" = tag ] || break
            tag_object="$(gh api "repos/${REPO}/git/tags/${object_sha}")"
            object_type="$(jq -er .object.type <<< "$tag_object")"
            object_sha="$(jq -er .object.sha <<< "$tag_object")"
          done
          [ "$object_type" = commit ]
          [ "$object_sha" = "$SHA" ]
          node scripts/release-recovery-policy.mjs issue \
            --repository "$REPO" < "$run_file" > "$issue_file"

      - name: Create or update one idempotent terminal issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue_file="$RUNNER_TEMP/release-issue.json"
          marker="$(jq -er .marker "$issue_file")"
          title="$(jq -er .title "$issue_file")"
          body="$(jq -er .body "$issue_file")"
          label="$(jq -er .label "$issue_file")"

          gh label create "$label" --repo "$REPO" \
            --color B60205 \
            --description "Automatic release exhausted its bounded retries" \
            --force

          existing="$(
            gh api --method GET --paginate "repos/${REPO}/issues" \
              -f state=all -f per_page=100 --slurp \
              | jq -c --arg marker "$marker" '
                  [flatten[] |
                    select(.user.login == "github-actions[bot]" and
                           (has("pull_request") | not) and
                           ((.body // "") | contains($marker)))]
                '
          )"
          count="$(jq -r length <<< "$existing")"
          case "$count" in
            0)
              result="$(
                jq -c --arg label "$label" \
                  '{title,body,labels:[$label]}' "$issue_file" \
                  | gh api --method POST "repos/${REPO}/issues" --input -
              )"
              ;;
            1)
              number="$(jq -er '.[0].number' <<< "$existing")"
              result="$(
                jq -c --arg label "$label" \
                  '{title,body,state:"open",labels:[$label]}' "$issue_file" \
                  | gh api --method PATCH \
                      "repos/${REPO}/issues/${number}" --input -
              )"
              ;;
            *)
              echo "::error::multiple terminal issues carry exact marker ${marker}"
              exit 1
              ;;
          esac

          jq -e --arg title "$title" --arg body "$body" --arg label "$label" '
            .user.login == "github-actions[bot]" and
            .title == $title and .body == $body and .state == "open" and
            ([.labels[].name] | index($label)) != null
          ' <<< "$result" >/dev/null
